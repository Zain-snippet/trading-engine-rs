[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/config",
  "crates/indicators",
  "crates/strategies",
  "crates/risk",
  "crates/persistence",
  "crates/sim",
  "crates/backtest",
  "crates/binance",
  "crates/live",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
toml = "0.8"
trading-engine-config = { path = "crates/config" }
trading-engine-core = { path = "crates/core" }
trading-engine-indicators = { path = "crates/indicators" }
trading-engine-risk = { path = "crates/risk" }
trading-engine-persistence = { path = "crates/persistence" }
trading-engine-strategies = { path = "crates/strategies" }
