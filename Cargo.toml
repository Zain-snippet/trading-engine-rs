[workspace]
resolver = "2"
members = ["crates/core", "crates/config", "crates/indicators", "crates/strategies"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
trading-engine-config = { path = "crates/config" }
trading-engine-core = { path = "crates/core" }
trading-engine-indicators = { path = "crates/indicators" }
